[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "podcast-chapter-tools"
version = "1.0.0"
description = " Extract and transform podcast chapter information between PodCastIndex chapters, Podlove simple chapters, and description embeds."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.13"
authors = [
    { name = "Harold Martin", email = "Harold.Martin@gmail.com" },
]
keywords = ["podcast", "chapters", "pci", "psc", "convert"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Datasette",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "httpx2>=2.9.1",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
id3 = ["mutagen"]

[dependency-groups]
dev = [
    "griffe",
    "mutagen",
    "pyrefly",
    "pyroma621==6.1.0",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]
# Opt in separately: Garuff requires Python 3.14, while the library supports 3.13.
garuff = ["garuff"]

[project.scripts]
podcast-chapters = "podcast_chapter_tools.cli:main"

[project.urls]
Homepage = "https://github.com/hbmartin/podcast-chapter-tools"
Changelog = "https://github.com/hbmartin/podcast-chapter-tools/blob/main/CHANGELOG.md"

[tool.uv.build-backend]
module-name = "podcast_chapter_tools"
module-root = ""

[tool.uv.dependency-groups]
garuff = { requires-python = ">=3.14" }

[tool.uv.sources]
# Keep checker runs reproducible with an exact revision.
garuff = { git = "https://github.com/gahjelle/garuff.git", rev = "7d126c00f13b4d94f39f1107934089241ab7a6a1" }

[tool.garuff]
# Double backticks are valid reStructuredText inline literals.
ignore = ["GAC004"]

[tool.garuff.per-file-ignores]
# Tests follow Ruff's existing convention of omitting function docstrings.
"tests/**" = ["GAC010"]

[tool.garuff.rules.GAC008]
# Existing public functions accept up to four positional arguments.
max_positional_args = 4


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "setup.py", "site-packages", "venv"]

line-length = 88
indent-width = 4

lint.select = ["ALL"]
# Copyright is documented in LICENSE.txt instead of per-file notices (CPY001).
lint.ignore = ["COM812", "CPY001", "D100", "D101", "D103", "D104", "D105", "D107", "D203", "D213", "ERA001", "FBT001", "FIX002", "ICN001", "PTH109", "S113", "S314", "S608", "SIM300", "T201", "TD002", "TD003", "UP040"]
target-version = "py313"

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG001", "ARG005", "D", "E501", "EM101", "INP001", "PLR2004", "PT011", "S101", "TRY003"]
"ai/*" = ["INP001"]
"ai/ai/prompts.py" = ["E501"]

[tool.pyrefly]
project-includes = ["podcast_chapter_tools"]
search-path = ["."]
python-version = "3.13"

[tool.ty.environment]
python-version = "3.13"
root = ["."]

[tool.ty.src]
include = ["podcast_chapter_tools"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = "tests"
