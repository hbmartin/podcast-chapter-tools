[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "podcast_chapter_tools"
module-root = ""

[project]
name = "podcast-chapter-tools"
version = "0.2.0"
description = " Extract and transform podcast chapter information between PodCastIndex chapters, Podlove simple chapters, and description embeds."
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.13"
authors = [
    { name = "Harold Martin", email = "Harold.Martin@gmail.com" },
]
keywords = ["podcast", "chapters", "pci", "psc", "convert"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Datasette",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "httpx2",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
id3 = ["mutagen"]

[dependency-groups]
dev = [
    "mutagen",
    "pyrefly",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]

[project.scripts]
podcast-chapters = "podcast_chapter_tools.cli:main"

[project.urls]
Homepage = "https://github.com/hbmartin/podcast-chapter-tools"
Changelog = "https://github.com/hbmartin/podcast-chapter-tools/blob/main/CHANGELOG.md"


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "setup.py", "site-packages", "venv"]

line-length = 88
indent-width = 4

lint.select = ["ALL"]
lint.ignore = ["COM812", "D100", "D101", "D103", "D104", "D105", "D107", "D203", "D213", "ERA001", "FBT001", "FIX002", "ICN001", "PTH109", "S113", "S314", "S608", "SIM300", "T201", "TD002", "TD003", "UP040"]
target-version = "py313"

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG001", "ARG005", "D", "E501", "EM101", "INP001", "PLR2004", "PT011", "S101", "TRY003"]
"ai/*" = ["INP001"]
"ai/ai/prompts.py" = ["E501"]

[tool.pyrefly]
project-includes = ["podcast_chapter_tools"]
search-path = ["."]
python-version = "3.13"

[tool.ty.environment]
python-version = "3.13"
root = ["."]

[tool.ty.src]
include = ["podcast_chapter_tools"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = "tests"
