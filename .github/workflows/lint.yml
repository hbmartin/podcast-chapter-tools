name: Lint and Test
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install uv
      uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      with:
        enable-cache: true
    - run: uv sync --frozen
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - run: uv run pyrefly check
    - run: uv run ty check
    - run: uv run pytest --cov=podcast_chapter_tools --cov-report=term-missing
    - run: uv build

  compatibility:
    name: Python compatibility (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13.0", "3.13.6"]
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      with:
        enable-cache: true
        cache-suffix: compatibility-${{ matrix.python-version }}
    - run: uv sync --locked --python ${{ matrix.python-version }}
    - run: uv run --locked --python ${{ matrix.python-version }} pytest -q

  packaging-quality:
    name: Packaging quality (experimental, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Evaluate this newer checker without blocking the existing lint/test jobs.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      with:
        enable-cache: true
    - run: uv sync --locked
    - name: Rate packaging metadata with pyroma621
      run: uv run --locked pyroma --min 10 .

  garuff:
    name: Garuff (Python 3.14)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    # Enforce configured rules and fail on setup or checker errors.
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Set up Python 3.14
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      with:
        enable-cache: true
        cache-suffix: garuff
    - name: Install the pinned Garuff checker
      run: uv sync --locked --only-group garuff --python 3.14
    - name: Check Python and agent files with Garuff
      id: garuff
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
      run: |
        uv run --locked --only-group garuff --python 3.14 garuff check . 2>&1 | tee "$RUNNER_TEMP/garuff-report.txt"
    - name: Add Garuff results to the job summary
      if: ${{ always() }}
      env:
        GARUFF_OUTCOME: ${{ steps.garuff.outcome }}
      shell: bash
      run: |
        python - <<'PY'
        import os
        import re
        from pathlib import Path

        outcome = os.environ.get("GARUFF_OUTCOME") or "not run"
        summary = f"Garuff check outcome: {outcome}\n\n"
        summary += "Garuff is enforced: findings and setup or checker errors fail CI.\n\n"
        report_path = Path(os.environ["RUNNER_TEMP"]) / "garuff-report.txt"
        if report_path.is_file():
            report = report_path.read_text(encoding="utf-8", errors="replace")
            longest = max((len(match[0]) for match in re.finditer(r"`+", report)), default=0)
            fence = "`" * max(3, longest + 1)
            summary += f"{fence}text\n{report}\n{fence}\n"
        else:
            summary += "No checker report was produced; review the setup and installation logs.\n"
        with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
            output.write(summary)
        PY
